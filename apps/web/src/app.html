<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Software Transaction Structuring Tool - Find the best deal structure for both you and your client" />
    <meta name="theme-color" content="#2D68FF" />
    <meta name="color-scheme" content="dark" />
    <title>Model Pear - Software Transaction Structuring</title>
    <!-- Figtree font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-background text-foreground antialiased">
    <div style="display: contents">%sveltekit.body%</div>

    <!-- Debug pill root — separate from SvelteKit tree so it survives app crashes -->
    <div id="debug-root"></div>

    <!--
      Pre-framework debug pill (inline, no dependencies).
      Captures errors before JS bundles load. Includes 20-second loading timeout
      that warns users if the framework fails to mount.
      Bridges to the Svelte app via window.__debugPushError().
    -->
    <script>
      // Circular buffer for pre-framework errors
      window.__debugErrors = [];
      window.__debugPushError = function(msg, stack) {
        window.__debugErrors.push({ msg: msg, stack: stack, time: Date.now() });
        if (window.__debugErrors.length > 200) window.__debugErrors.shift();
        // Update inline pill badge if it exists
        var badge = document.getElementById('debug-inline-error-count');
        if (badge) { badge.textContent = window.__debugErrors.length; badge.style.display = 'inline'; }
      };

      // Capture errors before any module scripts load.
      // Stored as named references on window so debugLog.ts can remove them
      // once the module takes over (prevents double-capture).
      window.__debugInlineErrorHandler = function(e) {
        window.__debugPushError(e.message || 'Unknown error', e.filename + ':' + e.lineno);
      };
      window.__debugInlineRejectionHandler = function(e) {
        window.__debugPushError('Unhandled rejection: ' + e.reason);
      };
      window.addEventListener('error', window.__debugInlineErrorHandler);
      window.addEventListener('unhandledrejection', window.__debugInlineRejectionHandler);

      // Loading timeout — warn user if framework fails to mount within 20s
      window.__debugSvelteMounted = false;
      window.__debugClearLoadTimer = function() {
        window.__debugSvelteMounted = true;
        clearTimeout(window.__debugLoadTimer);
        // Hide inline pill once Svelte pill takes over
        var inlinePill = document.getElementById('debug-inline-pill');
        if (inlinePill) inlinePill.style.display = 'none';
      };
      window.__debugLoadTimer = setTimeout(function() {
        if (!window.__debugSvelteMounted) {
          // Show inline pill with warning
          var pill = document.getElementById('debug-inline-pill');
          if (pill) pill.style.display = 'flex';
          var warning = document.getElementById('debug-inline-warning');
          if (warning) warning.style.display = 'block';
        }
      }, 20000);
    </script>

    <!-- Inline debug pill (visible only if framework fails to mount within 20s) -->
    <div id="debug-inline-pill" style="
      display: none;
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 80;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      font-family: monospace;
      font-size: 12px;
    ">
      <div id="debug-inline-warning" style="
        display: none;
        background: #1a1a1a;
        color: #eab308;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 12px 16px;
        max-width: 320px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        line-height: 1.4;
      ">
        This is taking longer than usual. Check the browser console for errors, or try reloading.
        <span id="debug-inline-error-count" style="
          display: none;
          background: #ef4444;
          color: #fff;
          border-radius: 9999px;
          padding: 0 5px;
          font-size: 10px;
          margin-left: 4px;
        ">0</span>
      </div>
    </div>
  </body>
</html>
