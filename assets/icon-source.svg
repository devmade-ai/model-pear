<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" shape-rendering="geometricPrecision">
  <!-- Model Pear app icon

       Concept: a Venn diagram. Two circles representing the two
       parties in a software transaction (Your Company / Client),
       with the lens-shaped overlap representing the equilibrium
       zone — the price/structure range where BOTH parties win.
       This is the tool's core thesis ("find the best deal for both")
       rendered as geometry.

       Geometry: just three SVG primitives + a clip-path:
         - <rect> for the background
         - two <circle>s for the parties
         - a third <circle> clipped to the left party's region,
           which produces the lens-shaped intersection.
       Editable by hand without bezier tooling.

       Colours: aligned with the dim DaisyUI theme.
         #2a323c  dim base-100 — matches the manifest theme_color so
                  the icon visually integrates with the splash screen
                  and the OS task-switcher chrome.
         #9FE88D  dim primary  — left party (Your Company / Seller).
         #7CD4FD  dim accent   — right party (Client / Buyer).
         #fbbd23  dim warning  — equilibrium zone (the sweet spot).

       Maskable safe zone: all three circles fit inside the inner
       80% (102-922 px). Background fills the full 1024x1024 canvas
       so the maskable crop has solid colour at every edge. -->

  <defs>
    <clipPath id="left-party">
      <circle cx="412" cy="512" r="240"/>
    </clipPath>
  </defs>

  <!-- Background — dim base-100 -->
  <rect width="1024" height="1024" fill="#2a323c"/>

  <!-- Left party circle — Your Company / Seller -->
  <circle cx="412" cy="512" r="240" fill="#9FE88D"/>

  <!-- Right party circle — Client / Buyer.
       Drawn second so it overwrites the left circle in the overlap
       region (otherwise the right would be obscured by the left's
       fill in the lens area). -->
  <circle cx="612" cy="512" r="240" fill="#7CD4FD"/>

  <!-- Equilibrium zone — the lens-shaped intersection.
       Source shape is the RIGHT circle, clipped to the LEFT circle's
       region: the result is exactly the two-circle intersection. -->
  <circle cx="612" cy="512" r="240" fill="#fbbd23"
          clip-path="url(#left-party)"/>
</svg>
